<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Fatiô</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fatiô">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--txt:#e5e7eb;--mut:#94a3b8;--verde:#22c55e;--verm:#ef4444;--azul:#3b82f6;--amar:#f59e0b;--roxo:#a855f7;--borda:#26324d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;font-size:15px;padding-bottom:84px;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--borda)}
header h1{font-size:19px;display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;border-radius:8px}
#sync{font-size:11px;color:var(--mut);display:block;font-weight:500;margin-top:2px}
.mes{display:flex;align-items:center;gap:6px;font-weight:700}
.mes button{background:var(--card2);border:none;color:var(--txt);width:32px;height:32px;border-radius:10px;font-size:16px}
.mes span{min-width:92px;text-align:center;text-transform:capitalize}
main{padding:14px 14px 0;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--borda)}
.card h3{font-size:14px;color:var(--mut);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.grande{font-size:30px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card2);border-radius:12px;padding:10px}
.mini small{color:var(--mut);font-size:12px}
.mini b{display:block;font-size:17px;margin-top:2px}
.pos{color:var(--verde)}.neg{color:var(--verm)}.amar{color:var(--amar)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda)}
.item:last-child{border-bottom:none}
.ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.info{flex:1;min-width:0}
.info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--mut);font-size:12px}
.val{font-weight:700;text-align:right;white-space:nowrap}
.barra{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0e1628;border-top:1px solid var(--borda);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px}
nav button span{font-size:21px}
nav button.on{color:var(--azul)}
.fab{position:fixed;right:18px;bottom:86px;width:58px;height:58px;border-radius:50%;background:var(--azul);color:#fff;border:none;font-size:30px;box-shadow:0 6px 20px #3b82f688;z-index:6}
.btn{background:var(--azul);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;width:100%}
.btn.sec{background:var(--card2);color:var(--txt)}
.btn.perigo{background:#7f1d1d}
.btnp{background:var(--card2);color:var(--txt);border:none;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.btnp.ok{background:#14532d;color:#86efac}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{background:var(--card2);border:1px solid var(--borda);color:var(--mut);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{border-color:var(--azul);color:#fff;background:#1e3a8a}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:sobe .2s}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:18px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:var(--card2);border:1px solid var(--borda);color:var(--txt);border-radius:10px;padding:11px;font-size:16px;font-family:inherit}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tipos button{background:var(--card2);border:2px solid transparent;color:var(--txt);border-radius:10px;padding:9px 4px;font-weight:700;font-size:13px}
.tipos button.on{border-color:var(--azul)}
.linha{display:flex;gap:8px;margin-top:14px}
.vazio{color:var(--mut);text-align:center;padding:16px 0;font-size:14px}
.vazio a{color:var(--mut)}
.olho{background:none;border:none;color:var(--mut);font-size:18px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px}
canvas{max-width:100%}
.legenda{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mut)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#111827;border:1px solid var(--borda);padding:10px 18px;border-radius:12px;z-index:60;font-size:14px}
.toast.acao{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;width:max-content;max-width:92vw}
.toast.acao span{flex:1 1 auto}
.toast.acao button{background:none;border:none;color:#60a5fa;font-weight:700;font-size:14px;white-space:nowrap;padding:4px 0}
.alerta{background:#451a03;border:1px solid #92400e;color:#fcd34d;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.oculto{display:none!important}
/* lançamento rápido */
.rapido{display:flex;gap:6px;margin-bottom:6px}
.rapido input{flex:1;min-width:0}
.rapido button{width:46px;flex-shrink:0;border:none;border-radius:10px;background:var(--card2);color:var(--txt);font-size:20px}
.rapido button.envia{background:var(--azul);color:#fff}
.rapido button.ouvindo{background:#b91c1c;animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.55}}
.dica-rap{color:var(--mut);font-size:12px;margin:0 2px 12px}
.dica{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--borda);font-size:14px;line-height:1.45}
.dica:last-child{border-bottom:none}
.diario .grande{font-size:28px}
.diario small{color:var(--mut);font-size:12px;line-height:1.5;display:block}
#hintCat{color:var(--verde);font-weight:600}
/* login */
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#login .box{width:100%;max-width:380px;text-align:center}
#login h2{font-size:30px;margin:12px 0 4px}
#login p{color:var(--mut);font-size:14px;margin-bottom:18px}
#login input{margin-bottom:10px}
.google{background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:8px}
.sep{color:var(--mut);font-size:12px;margin:14px 0}
.link{background:none;border:none;color:var(--azul);font-size:14px;margin-top:12px;text-decoration:underline;display:block;width:100%}
#erroLogin{color:#fca5a5;font-size:13px;min-height:18px;margin-top:8px}
/* PIN */
#trava{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#trava .box{text-align:center;width:100%;max-width:320px}
#trava h2{font-size:24px;margin-top:10px}
#pinMsg{color:var(--mut);font-size:14px;margin-top:6px;min-height:20px}
.dots{display:flex;justify-content:center;gap:18px;margin:20px 0 28px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}
.dots i.on{background:var(--txt);border-color:var(--txt)}
.dots.erro{animation:treme .35s}
@keyframes treme{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.teclado button{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--card2);border:none;color:var(--txt);font-size:26px;font-weight:600}
.teclado button:active{background:var(--borda)}
.teclado button.txt{background:none;font-size:13px;color:var(--mut);font-weight:600}
</style>
</head>
<body>
<header>
  <div><h1><img src="icon-192.png" class="logo" alt="">Fatiô <button id="instalar" class="btnp oculto">📲 Instalar</button></h1><span id="sync"></span></div>
  <div class="mes"><button id="mAnt">‹</button><span id="mTxt"></span><button id="mProx">›</button></div>
</header>
<main id="app"></main>
<button class="fab" id="fab">+</button>
<nav>
  <button data-t="inicio" class="on"><span>🏠</span>Início</button>
  <button data-t="lanc"><span>📋</span>Lançamentos</button>
  <button data-t="contas"><span>🧾</span>A pagar</button>
  <button data-t="planos"><span>🎯</span>Metas</button>
  <button data-t="mais"><span>⚙️</span>Mais</button>
</nav>
<div id="modal"></div>

<div id="login" class="oculto">
  <div class="box">
    <img src="icon-192.png" alt="Fatiô" style="width:88px;height:88px;border-radius:22px">
    <h2>Fatiô</h2>
    <p>Seu dinheiro, fatia por fatia.<br>Entre para acessar no celular e no computador, sempre sincronizado.</p>
    <button class="btn google" id="bGoogle"><b style="color:#4285f4">G</b> Entrar com Google</button>
    <div class="sep">ou com e-mail</div>
    <input id="lEmail" type="email" placeholder="seu@email.com" autocomplete="email">
    <input id="lSenha" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
    <div class="linha" style="margin-top:0"><button class="btn sec" id="bCriar">Criar conta</button><button class="btn" id="bEntrar">Entrar</button></div>
    <button class="link" id="bEsqueci">Esqueci a senha</button>
    <div id="erroLogin"></div>
    <button class="link" style="color:var(--mut)" onclick="semConta()">Continuar sem conta (só neste aparelho)</button>
    <a href="privacidade.html" class="link" style="color:var(--mut);font-size:12px">Política de privacidade</a>
  </div>
</div>

<div id="trava" class="oculto">
  <div class="box">
    <img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px">
    <h2>Fatiô</h2>
    <div id="pinMsg">Digite seu PIN</div>
    <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="teclado" id="teclado"></div>
  </div>
</div>

<script>
// ================== DADOS ==================
const VERSAO='1.1';
const CHAVE='minhasFinancas_v1'; // mantida para preservar dados já salvos
const CATS={
 despesa:{'Moradia':'🏠','Alimentação':'🍽️','Mercado':'🛒','Transporte':'🚗','Saúde':'💊','Educação':'📚','Lazer':'🎉','Filhos':'🧸','Contas/Serviços':'💡','Cartão':'💳','Empréstimo':'🏦','Roupas':'👕','Assinaturas':'📺','Pets':'🐶','Presentes':'🎁','Impostos':'🧾','Outros':'📦'},
 receita:{'Salário':'💼','Hora extra':'⏱️','Freela':'💻','Benefícios':'🎫','Rendimentos':'📈','Vendas':'🏷️','Reembolso':'↩️','Outros':'💵'}
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const novo=()=>({contas:[{id:uid(),nome:'Carteira',ic:'👛',saldoIni:0},{id:uid(),nome:'Conta corrente',ic:'🏦',saldoIni:0}],
  lancs:[],pagar:[],orc:{},metas:[],dividas:[],oculto:false});
let D;
try{D=JSON.parse(localStorage.getItem(CHAVE))||novo()}catch(e){D=novo()}
function norm(){['contas','lancs','pagar','metas','dividas'].forEach(k=>D[k]=D[k]||[]);D.orc=D.orc||{}}
norm();
function salva(){D.atualizado=Date.now();localStorage.setItem(CHAVE,JSON.stringify(D));if(window.nuvemSalvar)nuvemSalvar()}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

// ---- integração com a nuvem ----
let remotoPendente=null;
function aplicaRemoto(d,uidU,aviso){
  if(document.querySelector('#modal').innerHTML){remotoPendente=[d,uidU,aviso];return}
  D=d;norm();D.sincUid=uidU;localStorage.setItem(CHAVE,JSON.stringify(D));render();if(aviso)toast('🔄 Atualizado de outro aparelho');
}
function setSync(t){const e=document.querySelector('#sync');if(e)e.textContent=t}
function mostrarLogin(v){document.querySelector('#login').classList.toggle('oculto',!v)}
function semConta(){localStorage.setItem('semConta','1');mostrarLogin(false);setSync('📱 Só neste aparelho')}

// ================== UTIL ==================
const $=s=>document.querySelector(s);
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
let mes=hoje().slice(0,7),aba='inicio',filtro='todos';
const R=v=>D.oculto?'R$ •••':(v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>{s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.round((parseFloat(s)||0)*100)/100};
const nomeMes=m=>new Date(m+'-15T12:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','');
const addMes=(m,n)=>{let[y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+String(mm).padStart(2,'0')};
const ultDia=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const dataBR=d=>d.split('-').reverse().slice(0,2).join('/');
const icCat=(t,c)=>(CATS[t]&&CATS[t][c])||'📦';
const conta=id=>D.contas.find(c=>c.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const soma=a=>a.reduce((s,l)=>s+l.valor,0);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function toastAcao(msg,bts,ms=7000){
  document.querySelectorAll('.toast.acao').forEach(e=>e.remove());
  const e=document.createElement('div');e.className='toast acao';
  const s=document.createElement('span');s.textContent=msg;e.appendChild(s);
  bts.forEach(b=>{const x=document.createElement('button');x.textContent=b.t;x.onclick=()=>{e.remove();b.fn()};e.appendChild(x)});
  document.body.appendChild(e);setTimeout(()=>e.remove(),ms);
}
function addDias(d,n){const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}

// saldo até uma data (lançamentos futuros só contam quando a data chegar)
function saldoConta(id,ate){
  const c=conta(id);let s=c?c.saldoIni:0;
  D.lancs.forEach(l=>{if(ate&&l.data>ate)return;
    if(l.tipo==='receita'&&l.conta===id)s+=l.valor;
    if(l.tipo==='despesa'&&l.conta===id)s-=l.valor;
    if(l.tipo==='transf'){if(l.conta===id)s-=l.valor;if(l.dest===id)s+=l.valor}});
  return Math.round(s*100)/100;
}
const saldoTotal=ate=>D.contas.reduce((a,c)=>a+saldoConta(c.id,ate),0);
// ---- Caixinhas: sub-contas dentro de uma conta (ex.: Nubank › Viagem) ----
const ehCx=c=>!!(c&&c.pai);
const principais=()=>D.contas.filter(c=>!c.pai);
const caixinhas=paiId=>D.contas.filter(c=>c.pai===paiId);
const nomeConta=id=>{const c=conta(id);if(!c)return'';const p=c.pai&&conta(c.pai);return p?p.nome+' › '+c.nome:c.nome};
const saldoDisponivel=ate=>principais().reduce((a,c)=>a+saldoConta(c.id,ate),0);
const saldoGuardado=ate=>D.contas.filter(ehCx).reduce((a,c)=>a+saldoConta(c.id,ate),0);
// líquido guardado nas caixinhas no mês (transferências entre conta e caixinha)
function guardadoNoMes(m){
  let g=0;doMes(m).forEach(l=>{if(l.tipo!=='transf')return;
    const o=conta(l.conta),d=conta(l.dest);
    if(!ehCx(o)&&ehCx(d))g+=l.valor;else if(ehCx(o)&&!ehCx(d))g-=l.valor});
  return Math.round(g*100)/100;
}
const doMes=m=>D.lancs.filter(l=>l.data.slice(0,7)===m);
function resumo(m){let r=0,d=0;doMes(m).forEach(l=>{if(l.tipo==='receita')r+=l.valor;if(l.tipo==='despesa')d+=l.valor});return{r,d,s:r-d}}
function gastoCat(m){const o={};doMes(m).filter(l=>l.tipo==='despesa').forEach(l=>o[l.cat]=(o[l.cat]||0)+l.valor);return o}
function pagarDoMes(m){
  return D.pagar.filter(p=>p.rec?(p.inicio<=m&&(!p.fim||p.fim>=m)):p.data.slice(0,7)===m)
    .map(p=>{const venc=p.rec?m+'-'+String(Math.min(p.dia,ultDia(m))).padStart(2,'0'):p.data;
      return{...p,venc,pago:!!(p.pagos&&p.pagos[m])}}).sort((a,b)=>a.venc.localeCompare(b.venc));
}
const idsDeContas=()=>{const s=new Set();D.pagar.forEach(p=>Object.values(p.pagos||{}).forEach(id=>s.add(id)));return s};

// ==== PARSER ====
const semAcento=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const STOP=new Set(['de','do','da','dos','das','no','na','nos','nas','em','com','pelo','pela','pro','pra','para','o','a','os','as','um','uma','e']);
const VERB_D=new Set(['gastei','paguei','comprei','despesa','gasto','lancar','lanca','coloca','adiciona','registra']);
const VERB_R=new Set(['recebi','ganhei','receita','entrou','caiu']);
const MOEDA=new Set(['reais','real','conto','contos','pila','pilas']);
const KW={
 despesa:[
  ['Mercado',['mercado','supermercado','feira','atacadao','assai','carrefour','hortifruti','sacolao','atacarejo','pao de acucar','compras do mes']],
  ['Alimentação',['ifood','restaurante','lanche','almoco','jantar','pizza','padaria','cafe','hamburguer','rappi','marmita','acai','lanchonete','sorvete','churrasco','delivery','pastel']],
  ['Transporte',['uber','99','99pop','gasolina','combustivel','etanol','alcool','posto','onibus','metro','estacionamento','pedagio','taxi','bilhete','passagem','oficina','mecanico','ipva']],
  ['Moradia',['aluguel','condominio','iptu','reforma','moveis']],
  ['Contas/Serviços',['luz','energia','agua','internet','telefone','celular','gas','enel','sabesp','vivo','claro','tim','oi','conta de luz','conta de agua']],
  ['Saúde',['farmacia','remedio','remedios','medico','consulta','dentista','exame','drogasil','droga raia','plano de saude','academia','hospital']],
  ['Educação',['escola','curso','faculdade','livro','livros','material escolar','mensalidade','apostila']],
  ['Lazer',['cinema','show','viagem','passeio','parque','hotel','ingresso','balada','bar','cerveja','festa']],
  ['Filhos',['fralda','fraldas','brinquedo','creche','mesada']],
  ['Assinaturas',['netflix','spotify','prime','amazon prime','disney','hbo','max','youtube','globoplay','icloud','deezer','chatgpt','assinatura']],
  ['Pets',['racao','pet','petshop','veterinario','banho e tosa']],
  ['Roupas',['roupa','roupas','tenis','sapato','camisa','camiseta','calca','renner','riachuelo','cea','shein','vestido']],
  ['Presentes',['presente','presentes','aniversario']],
  ['Cartão',['fatura','cartao']],
  ['Empréstimo',['emprestimo','financiamento','consignado','parcela do emprestimo']],
  ['Impostos',['imposto','darf','das','irpf','taxa']]
 ],
 receita:[
  ['Salário',['salario','pagamento','adiantamento','vale salario','13o','decimo terceiro','ferias','plr']],
  ['Hora extra',['hora extra','horas extras','he','sobreaviso','acionamento','plantao']],
  ['Freela',['freela','freelance','job','bico','servico']],
  ['Benefícios',['vale refeicao','vale alimentacao','va','vr','beneficio','auxilio']],
  ['Rendimentos',['rendimento','rendimentos','juros','dividendo','dividendos','cdb','poupanca']],
  ['Vendas',['venda','vendi','vendas']],
  ['Reembolso',['reembolso','estorno','devolucao','cashback']]
 ]
};
const RECEITA_FORTE=['salario','hora extra','horas extras','sobreaviso','acionamento','freela','freelance','rendimento','rendimentos','dividendo','dividendos','reembolso','estorno','vendi','cashback','13o','plr','adiantamento'];
const limpaTxt=x=>semAcento(x).replace(/\s+\d+\/\d+$/,'').replace(/[^\w ]/g,' ').replace(/\s+/g,' ').trim();
function dictCat(texto,tipo){
  const t=' '+limpaTxt(texto)+' ';
  for(const[cat,kws]of KW[tipo]||[])for(const k of kws)if(t.includes(' '+k+' '))return cat;
  return null;
}
function histMatch(texto,tipo){
  const n=limpaTxt(texto);if(!n)return null;
  const lst=D.lancs.filter(l=>l.tipo!=='transf'&&l.cat&&l.desc&&(!tipo||l.tipo===tipo)).slice(-400).reverse();
  const ex=lst.find(l=>limpaTxt(l.desc)===n);if(ex)return{tipo:ex.tipo,cat:ex.cat};
  const chave=x=>x.split(' ').find(w=>w.length>=3&&!/^\d+$/.test(w)&&!STOP.has(w));
  const k=chave(n);if(!k)return null;
  const votos={};lst.forEach(l=>{if(chave(limpaTxt(l.desc))===k){const id=l.tipo+'|'+l.cat;votos[id]=(votos[id]||0)+1}});
  const top=Object.entries(votos).sort((a,b)=>b[1]-a[1])[0];if(!top)return null;
  const[tp,ct]=top[0].split('|');return{tipo:tp,cat:ct};
}
function sugereCat(texto,tipo){
  const h=histMatch(texto,tipo);if(h&&CATS[tipo][h.cat])return h.cat;
  const d=dictCat(texto,tipo);return d&&CATS[tipo][d]?d:null;
}
function toValor(n){n=n.replace('r$','');if(/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(n))n=n.replace(/\./g,'');return num(n)}
function parseRapido(txt){
  let tipo=null,s=String(txt||'').trim();
  if(s.startsWith('+')){tipo='receita';s=s.slice(1)}else if(/^-\s*\D/.test(s)){tipo='despesa';s=s.slice(1)}
  const tk=s.split(/\s+/).filter(Boolean).map(o=>({o,n:semAcento(o).replace(/[!?;:]+$/,'').replace(/[.,]+$/,''),rm:false}));
  let data=hoje(),valor=0,contaId=null;
  // datas
  tk.forEach((t,i)=>{if(t.rm)return;
    if(t.n==='hoje')t.rm=true;
    else if(t.n==='ontem'){data=addDias(hoje(),-1);t.rm=true}
    else if(t.n==='anteontem'){data=addDias(hoje(),-2);t.rm=true}
    else if(t.n==='dia'&&tk[i+1]&&/^\d{1,2}$/.test(tk[i+1].n)&&+tk[i+1].n>=1&&+tk[i+1].n<=31){
      const m=hoje().slice(0,7);data=m+'-'+String(Math.min(+tk[i+1].n,ultDia(m))).padStart(2,'0');t.rm=true;tk[i+1].rm=true}});
  // valor
  const ehNum=n=>/^(r\$)?(\d{1,3}(\.\d{3})+(,\d{1,2})?|\d+([.,]\d{1,2})?)$/.test(n);
  for(let i=0;i<tk.length;i++){ // "23 reais e 50 centavos"
    if(!tk[i].rm&&/^\d+$/.test(tk[i].n)&&MOEDA.has(tk[i+1]?.n)&&tk[i+2]?.n==='e'&&/^\d{1,2}$/.test(tk[i+3]?.n||'')&&/^centavos?$/.test(tk[i+4]?.n||'')){
      valor=+tk[i].n+(+tk[i+3].n)/100;for(let j=i;j<=i+4;j++)tk[j].rm=true;break}}
  if(!valor){
    const cand=tk.map((t,i)=>(!t.rm&&ehNum(t.n))?i:-1).filter(i=>i>=0);
    if(cand.length){
      const pref=cand.find(i=>tk[i].n.startsWith('r$')||tk[i-1]?.n==='r$'||MOEDA.has(tk[i+1]?.n));
      const i=pref!==undefined?pref:cand[cand.length-1];
      valor=toValor(tk[i].n);tk[i].rm=true;
    }
  }
  tk.forEach(t=>{if(t.n==='r$'||MOEDA.has(t.n))t.rm=true});
  // tipo por palavra
  tk.forEach(t=>{if(t.rm)return;if(VERB_R.has(t.n)){tipo=tipo||'receita';t.rm=true}else if(VERB_D.has(t.n)){tipo=tipo||'despesa';t.rm=true}});
  // conta
  for(const c of principais()){
    const nt=semAcento(c.nome).split(/\s+/).filter(Boolean);
    for(let i=0;i+nt.length<=tk.length;i++){
      if(nt.every((w,j)=>!tk[i+j].rm&&tk[i+j].n===w)){contaId=c.id;for(let j=0;j<nt.length;j++)tk[i+j].rm=true;break}}
    if(contaId)break;
  }
  if(!contaId)for(const c of principais()){
    for(const w of semAcento(c.nome).split(/\s+/)){
      if(w.length<4||['conta','banco','corrente','cartao'].includes(w))continue;
      const t=tk.find(x=>!x.rm&&x.n===w);if(t){t.rm=true;contaId=c.id;break}}
    if(contaId)break;
  }
  // limpa palavras de ligação soltas
  let mudou=true;
  while(mudou){mudou=false;
    for(let i=0;i<tk.length;i++){const t=tk[i];if(t.rm||!STOP.has(t.n))continue;
      const antes=tk.slice(0,i).some(x=>!x.rm),prox=tk.slice(i+1).find(x=>!x.rm),vizinho=tk[i+1];
      if(!antes||!prox||!vizinho||vizinho.rm){t.rm=true;mudou=true}}}
  let desc=tk.filter(t=>!t.rm).map(t=>t.o).join(' ').replace(/^[-+\s]+/,'').trim();
  desc=desc.charAt(0).toUpperCase()+desc.slice(1);
  const base=desc||s;
  if(!tipo){
    const h=histMatch(base,null);
    if(h)tipo=h.tipo;
    else{const t=' '+limpaTxt(base)+' ';tipo=RECEITA_FORTE.some(k=>t.includes(' '+k+' '))?'receita':'despesa'}
  }
  const cat=sugereCat(base,tipo)||'Outros';
  return{tipo,valor,desc,cat,conta:contaId,data};
}

function ouvir(){
  if(!SR)return;

  rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.continuous=false;

}

function dicas(m){
  const h=hoje(),mAtual=h.slice(0,7),atual=m===mAtual,passado=m<mAtual;
  const r=resumo(m),gc=gastoCat(m),ga=gastoCat(addMes(m,-1)),out=[];
  const ic=c=>icCat('despesa',c);
  // 1. projeção do mês
  if(atual&&(r.r>0||r.d>0)){
    const ids=idsDeContas(),dia=+h.slice(8),rest=ultDia(m)-dia;
    const varia=soma(doMes(m).filter(l=>l.tipo==='despesa'&&l.data<=h&&!ids.has(l.id)));
    const media=varia/dia,pend=soma(pagarDoMes(m).filter(p=>!p.pago));
    const prev=r.r-r.d-pend-media*rest;
    out.push(prev>=0?`📈 No ritmo atual, você deve fechar o mês com <b class="pos">${R(prev)}</b> sobrando.`
      :`⚠️ No ritmo atual, o mês deve fechar <b class="neg">${R(-prev)}</b> no vermelho. Seus gastos do dia a dia estão em ${R(media)} por dia.`);
  }
  // 2. maior aumento
  let up=null;for(const c in gc){const a=ga[c]||0;if(a>=50&&gc[c]>a*1.2&&gc[c]-a>=30&&(!up||gc[c]-a>up.d))up={c,d:gc[c]-a,p:Math.round((gc[c]/a-1)*100),a}}
  if(up)out.push(atual?`📊 ${ic(up.c)} Em ${up.c} você já gastou ${R(gc[up.c])}, ${up.p}% a mais que no mês passado inteiro.`
    :`📊 ${ic(up.c)} Você gastou ${up.p}% a mais em ${up.c} que no mês anterior (${R(gc[up.c])} contra ${R(up.a)}).`);
  // 3. maior economia (mês fechado)
  if(passado){let dn=null;for(const c in ga){const a=ga[c],g=gc[c]||0;if(a>=50&&g<a*.85&&(!dn||a-g>dn.d))dn={c,d:a-g}}
    if(dn)out.push(`👏 Você economizou ${R(dn.d)} em ${dn.c} comparado ao mês anterior.`)}
  // 4. pequenos gastos
  const peq=doMes(m).filter(l=>l.tipo==='despesa'&&l.valor<=30);
  if(peq.length>=5)out.push(`☕ Pequenos gastos (até R$ 30) ${atual?'já somam':'somaram'} ${R(soma(peq))} em ${peq.length} compras.`);
  // 5. quanto guardou (mês fechado)
  if(passado&&r.r>0)out.push(r.s>=0?`💰 Você guardou ${Math.round(r.s/r.r*100)}% da sua renda neste mês.`:`🔻 Você gastou ${R(-r.s)} a mais do que ganhou neste mês.`);
  // 6. maior categoria
  const cs=Object.entries(gc).sort((a,b)=>b[1]-a[1]);
  if(cs.length>=2&&r.d>0)out.push(`${ic(cs[0][0])} Sua maior despesa ${atual?'até agora':'do mês'} é ${cs[0][0]}: ${Math.round(cs[0][1]/r.d*100)}% dos gastos.`);
  // 7. metas com prazo
  const mt=D.metas.find(x=>x.prazo&&x.prazo>h&&x.atual<x.alvo);
  if(mt){const[py,pm]=mt.prazo.split('-').map(Number),[hy,hm]=h.split('-').map(Number);const meses=Math.max(1,(py-hy)*12+(pm-hm));

}

const CORES=['#3b82f6','#ef4444','#f59e0b','#22c55e','#a855f7','#ec4899','#14b8a6','#f97316','#64748b'];
function prepCanvas(id){const c=document.getElementById(id),dpr=devicePixelRatio||1,w=c.parentElement.clientWidth-28,h=+c.getAttribute('height');
  c.style.width=w+'px';c.style.height=h+'px';c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);return{x,w,h}}
function pizza(cats){
  const{x,w,h}=prepCanvas('pizza');let top=cats.slice(0,8);if(cats.length>8)top.push(['Outras',cats.slice(8).reduce((a,c)=>a+c[1],0)]);
  const tot=top.reduce((a,c)=>a+c[1],0);let ang=-Math.PI/2;const cx=w/2,cy=h/2,r=h/2-6;
  top.forEach(([c,v],i)=>{const a=v/tot*Math.PI*2;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,ang,ang+a);x.fillStyle=CORES[i%9];x.fill();ang+=a});
  x.beginPath();x.arc(cx,cy,r*.58,0,7);x.fillStyle='#131c2e';x.fill();
  x.fillStyle='#e5e7eb';x.font='bold 14px system-ui';x.textAlign='center';x.fillText(R(tot),cx,cy+5);
  $('#leg').innerHTML=top.map(([c,v],i)=>`<span><i style="background:${CORES[i%9]}"></i>${icCat('despesa',c)} ${esc(c)} ${D.oculto?'':Math.round(v/tot*100)+'%'}</span>`).join('');
}
function barras(){
  const{x,w,h}=prepCanvas('barras');const ms=[...Array(6)].map((_,i)=>addMes(mes,i-5)),rs=ms.map(resumo);
  const max=Math.max(1,...rs.map(r=>Math.max(r.r,r.d)));const gw=w/6,bw=gw*.3,base=h-20;
  rs.forEach((r,i)=>{const gx=i*gw+gw/2;
    x.fillStyle='#22c55e';const hr=r.r/max*(base-10);x.fillRect(gx-bw-1,base-hr,bw,hr);
    x.fillStyle='#ef4444';const hd=r.d/max*(base-10);x.fillRect(gx+1,base-hd,bw,hd);
    x.fillStyle=ms[i]===mes?'#fff':'#94a3b8';x.font='11px system-ui';x.textAlign='center';x.fillText(nomeMes(ms[i]),gx,h-5)});
}

function baixar(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportar(){D.ultBackup=Date.now();salva();baixar('backup-fatio-'+hoje()+'.json',JSON.stringify(D),'application/json');render()}
function exportarCSV(){const l=[['Data','Tipo','Descrição','Categoria','Conta','Valor']].concat([...D.lancs].sort((a,b)=>a.data.localeCompare(b.data)).map(x=>[x.data.split('-').reverse().join('/'),x.tipo,x.desc||'',x.cat||'',x.tipo==='transf'?nomeConta(x.conta)+' → '+nomeConta(x.dest):nomeConta(x.conta),String(x.tipo==='despesa'?-x.valor:x.valor).replace('.',',')]));
  baixar('fatio-lancamentos-'+hoje()+'.csv','\ufeff'+l.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv')}
function importar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);
  if(!n.lancs||!n.contas)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){const u=D.sincUid;D=n;norm();D.sincUid=u;salva();toast('✅ Backup restaurado');render()}}catch(_){alert('Arquivo de backup inválido')}};r.readAsText(f);e.target.value=''}
function zerar(){if(confirm('Apagar TUDO? Isso não pode ser desfeito (inclusive na nuvem).')&&confirm('Tem certeza mesmo? Faça um backup antes.')){const u=D.sincUid;D=novo();D.sincUid=u;salva();render()}}

   <div id="bQtd" class="oculto"><label>Quantas vezes no total (ex.: parcelas)</label><input id="fqtd" type="number" min="2" max="120" value="12"></div>`:''}
   <div class="linha">${id?'<button class="btn perigo" id="del" style="width:auto">🗑️</button>':''}<button class="btn sec" onclick="fechar()">Cancelar</button><button class="btn" id="ok">Salvar</button></div>`);
  const sugerir=()=>{
    if(catManual||tipo==='transf')return;
    const s=sugereCat($('#fd').value,tipo);

  };

    $('#bCat').classList.toggle('oculto',tipo==='transf');$('#bDest').classList.toggle('oculto',tipo!=='transf');

  document.querySelectorAll('.tipos button').forEach(b=>b.onclick=()=>{tipo=b.dataset.k;atualiza()});
  $('#fc').onchange=()=>{catManual=true;$('#hintCat').textContent=''};

  if($('#frep'))$('#frep').onchange=e=>$('#bQtd').classList.toggle('oculto',!e.target.checked);
  if(!id)setTimeout(()=>{const f=pre.valor?$('#fd'):$('#fv');f&&f.focus()},150);
  if(id)$('#del').onclick=()=>{if(confirm('Excluir lançamento?')){D.lancs=D.lancs.filter(x=>x.id!==id);D.pagar.forEach(p=>{for(const k in p.pagos||{})if(p.pagos[k]===id)delete p.pagos[k]});salva();fechar()}};
  $('#ok').onclick=()=>{
    const v=num($('#fv').value);if(v<=0)return alert('Informe o valor');
    if(tipo==='transf'&&$('#fa').value===$('#fdst').value)return alert('Escolha contas diferentes');
    const base={tipo,valor:v,desc:$('#fd').value.trim(),cat:tipo==='transf'?'':$('#fc').value,conta:$('#fa').value,data:$('#fdt').value||hoje()};
    if(tipo==='transf')base.dest=$('#fdst').value;

    salva();fechar();toast('✅ Salvo')};
}

   ${sinal<0&&max>0?`<button class="btnp" style="margin-top:8px" onclick="$('#xv').value='${String(max).replace('.',',')}'">Resgatar tudo</button>`:''}

    D.lancs.push({id:uid(),tipo:'transf',valor:v,desc:(sinal>0?'Guardar em ':'Resgate de ')+x.nome,cat:'',conta:sinal>0?p.id:x.id,dest:sinal>0?x.id:p.id,data:$('#xd').value||h});

// ================== PIN ==================
const PINK='fatioPin';
const temPin=()=>!!localStorage.getItem(PINK);
async function hashPin(p,s){
  const t=s+':'+p;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const ch of t)h=((h<<5)+h+ch.charCodeAt(0))|0;return'f'+h;
}
async function confere(p){try{const o=JSON.parse(localStorage.getItem(PINK));return(await hashPin(p,o.s))===o.h}catch(_){return false}}
async function salvaPin(p){const s=uid();localStorage.setItem(PINK,JSON.stringify({s,h:await hashPin(p,s)}))}
let pinBuf='',pinCb=null,pinOcupado=false,tentativas=0,bloqueadoAte=0,aposDestravar=null;
function montaTeclado(){
  $('#teclado').innerHTML=['1','2','3','4','5','6','7','8','9'].map(k=>`<button data-k="${k}">${k}</button>`).join('')+
    `<div><button class="txt" id="pinEsq">Esqueci</button><button class="txt oculto" id="pinCanc">Cancelar</button></div><button data-k="0">0</button><button class="txt" data-k="x" style="font-size:24px">⌫</button>`;
  $('#teclado').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>teclaPin(b.dataset.k));
  $('#pinEsq').onclick=esqueciPin;$('#pinCanc').onclick=fecharPin;
}
function desenhaDots(){document.querySelectorAll('#pinDots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length))}
function pedirPin(titulo,cb,opc={}){
  pinBuf='';pinCb=cb;$('#pinMsg').textContent=titulo;
  $('#pinEsq').classList.toggle('oculto',!opc.esqueci);$('#pinCanc').classList.toggle('oculto',!opc.cancelar);
  desenhaDots();$('#trava').classList.remove('oculto');
}
function fecharPin(){$('#trava').classList.add('oculto');pinCb=null;pinBuf=''}
async function teclaPin(k){
  if(pinOcupado||!pinCb)return;
  if(k==='x'){pinBuf=pinBuf.slice(0,-1);desenhaDots();return}
  if(pinBuf.length>=4)return;
  pinBuf+=k;desenhaDots();
  if(pinBuf.length===4){
    pinOcupado=true;const p=pinBuf;await new Promise(r=>setTimeout(r,120));
    const ok=await pinCb(p);pinOcupado=false;
    if(ok===false){$('#pinDots').classList.add('erro');navigator.vibrate&&navigator.vibrate(150);setTimeout(()=>$('#pinDots').classList.remove('erro'),400)}
    pinBuf='';desenhaDots();
  }
}
document.addEventListener('keydown',e=>{if($('#trava').classList.contains('oculto'))return;if(/^\d$/.test(e.key))teclaPin(e.key);else if(e.key==='Backspace')teclaPin('x')});
function travar(){
  if(!temPin())return;
  pedirPin('Digite seu PIN',async p=>{
    if(Date.now()<bloqueadoAte){$('#pinMsg').textContent='Muitas tentativas. Aguarde '+Math.ceil((bloqueadoAte-Date.now())/1000)+'s';return false}
    if(await confere(p)){tentativas=0;fecharPin();const f=aposDestravar;aposDestravar=null;if(f)setTimeout(f,80);return true}
    tentativas++;
    if(tentativas>=5){bloqueadoAte=Date.now()+30000;tentativas=0;$('#pinMsg').textContent='PIN incorreto. Aguarde 30 segundos'}
    else $('#pinMsg').textContent='PIN incorreto ('+(5-tentativas)+' tentativas restantes)';
    return false;
  },{esqueci:true});
}
function ativarPin(msg){
  pedirPin(msg||'Crie um PIN de 4 dígitos',p1=>{
    pedirPin('Confirme o PIN',async p2=>{
      if(p1!==p2){ativarPin('Os PINs não conferem. Crie de novo');return false}
      await salvaPin(p2);fecharPin();toast('🔒 PIN ativado');render();return true;
    },{cancelar:true});
    return true;
  },{cancelar:true});
}
function verificarPin(depois){
  pedirPin('Digite o PIN atual',async p=>{if(await confere(p)){depois();return true}$('#pinMsg').textContent='PIN incorreto';return false},{cancelar:true});
}
function alterarPin(){verificarPin(()=>ativarPin('Crie o novo PIN'))}
function desativarPin(){verificarPin(()=>{localStorage.removeItem(PINK);fecharPin();toast('PIN desativado');render()})}
function esqueciPin(){
  if(D.sincUid||window.usuario){
    if(!window.sair){toast('Aguarde conectar e tente de novo');return}
    if(!confirm('Para remover o PIN, você vai sair da conta neste aparelho.\n\nSeus dados continuam salvos na nuvem e voltam quando você entrar de novo.'))return;
    localStorage.removeItem(PINK);fecharPin();sair(true);
  }else{
    if(!confirm('Sem conta, não há como recuperar o PIN.\n\nRemover o PIN vai APAGAR os dados deste aparelho. Se você tem um arquivo de backup, poderá restaurá-lo depois.\n\nContinuar?'))return;
    localStorage.removeItem(PINK);D=novo();localStorage.setItem(CHAVE,JSON.stringify(D));fecharPin();aba='inicio';render();
  }
}
let saiuEm=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){saiuEm=Date.now();return}
  if(temPin()&&saiuEm&&Date.now()-saiuEm>60000&&$('#trava').classList.contains('oculto'))travar();
});

// ================== EVENTOS ==================
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{aba=b.dataset.t;scrollTo(0,0);render()});
$('#mAnt').onclick=()=>{mes=addMes(mes,-1);render()};
$('#mProx').onclick=()=>{mes=addMes(mes,1);render()};
$('#fab').onclick=()=>{if(aba==='contas')formPagar();else if(aba==='planos')formMeta();else formLanc()};
addEventListener('resize',()=>{if(aba==='inicio'&&!$('#modal').innerHTML&&document.activeElement?.id!=='rapTxt')render()});
montaTeclado();
render();

// atalhos do ícone (segurar o ícone → Nova despesa / Nova receita)
const novoTipo=new URLSearchParams(location.search).get('novo');
if(novoTipo==='despesa'||novoTipo==='receita'){
  history.replaceState(null,'',location.pathname);
  aposDestravar=()=>formLanc(null,{tipo:novoTipo});
}
if(temPin())travar();
else if(aposDestravar){const f=aposDestravar;aposDestravar=null;setTimeout(f,200)}

// ================== PWA ==================
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let pedidoInstalar;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInstalar=e;$('#instalar').classList.remove('oculto')});
$('#instalar').onclick=async()=>{if(!pedidoInstalar)return;pedidoInstalar.prompt();await pedidoInstalar.userChoice;pedidoInstalar=null;$('#instalar').classList.add('oculto')};
addEventListener('appinstalled',()=>{$('#instalar').classList.add('oculto');toast('✅ App instalado!')});
</script>

<script src="config.js"></script>
<script type="module">
// ================== LOGIN + SINCRONIZAÇÃO (Firebase) ==================
const cfg=window.FIREBASE_CONFIG;
if(!cfg||!cfg.apiKey||cfg.apiKey.includes('COLE')){
  window.modoLocal=true;mostrarLogin(false);setSync('📱 Só neste aparelho');
}else{
  if(!localStorage.getItem('semConta'))setSync('⏳ Conectando…');
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  try{
  const {initializeApp}=await import(V+'firebase-app.js');
  const A=await import(V+'firebase-auth.js');
  const F=await import(V+'firebase-firestore.js');
  const app=initializeApp(cfg);
  const auth=A.getAuth(app);
  auth.languageCode='pt';
  const db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
  let ref=null,unsub=null,timer=null;
  const tem=d=>!!(d&&((d.lancs||[]).length||(d.pagar||[]).length||(d.metas||[]).length||(d.dividas||[]).length));

  window.nuvemSalvar=()=>{
    if(!ref)return;clearTimeout(timer);
    setSync(navigator.onLine?'⏳ Salvando…':'📴 Offline – salvo no aparelho');
    timer=setTimeout(async()=>{
      if(!ref)return;
      try{await F.setDoc(ref,{dados:JSON.stringify(D),atualizado:D.atualizado||Date.now()});setSync('☁️ Sincronizado')}
      catch(e){console.error(e);setSync('⚠️ Erro ao sincronizar')}
    },700);
  };
  addEventListener('online',()=>{if(ref)setSync('☁️ Sincronizado')});
  addEventListener('offline',()=>{if(ref)setSync('📴 Offline – salvo no aparelho')});

  const MSG={'auth/invalid-email':'E-mail inválido','auth/missing-password':'Digite a senha','auth/weak-password':'Senha fraca: use pelo menos 6 caracteres',
    'auth/email-already-in-use':'Esse e-mail já tem conta. Toque em Entrar.','auth/invalid-credential':'E-mail ou senha incorretos',
    'auth/wrong-password':'Senha incorreta','auth/user-not-found':'Conta não encontrada','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.',
    'auth/network-request-failed':'Sem internet','auth/unauthorized-domain':'Site não autorizado no Firebase (domínios autorizados)',
    'auth/popup-closed-by-user':'Login cancelado','auth/operation-not-allowed':'Esse tipo de login não foi ativado no Firebase',
    'auth/requires-recent-login':'Por segurança, saia, entre de novo e repita a exclusão','auth/user-mismatch':'Use a mesma conta que está conectada'};
  const erro=e=>{document.getElementById('erroLogin').textContent=MSG[e.code]||('Erro: '+(e.code||e.message))};
  const em=()=>document.getElementById('lEmail').value.trim(),se=()=>document.getElementById('lSenha').value;

  document.getElementById('bGoogle').onclick=async()=>{
    const p=new A.GoogleAuthProvider();
    try{await A.signInWithPopup(auth,p)}
    catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))await A.signInWithRedirect(auth,p);else erro(e)}
  };
  document.getElementById('bEntrar').onclick=()=>A.signInWithEmailAndPassword(auth,em(),se()).catch(erro);
  document.getElementById('bCriar').onclick=()=>A.createUserWithEmailAndPassword(auth,em(),se()).catch(erro);
  document.getElementById('bEsqueci').onclick=()=>{if(!em())return erro({code:'auth/invalid-email'});
    A.sendPasswordResetEmail(auth,em()).then(()=>document.getElementById('erroLogin').textContent='📧 Enviamos um link para redefinir a senha').catch(erro)};
  A.getRedirectResult(auth).catch(erro);

  window.sair=async(semPerguntar)=>{
    if(!semPerguntar&&!confirm('Sair da conta?\n\nOs dados continuam salvos na nuvem e serão apagados só deste aparelho.'))return;
    if(unsub)unsub();unsub=null;ref=null;window.usuario=null;
    await A.signOut(auth);D=novo();localStorage.setItem(CHAVE,JSON.stringify(D));aba='inicio';render();
  };

  // ---- Excluir conta e todos os dados (exigência da Play Store) ----
  window.excluirConta=async()=>{
    const u=auth.currentUser;if(!u)return;
    if(!confirm('Excluir sua conta e TODOS os seus dados?\n\nIsso apaga tudo da nuvem e deste aparelho e não pode ser desfeito.'))return;
    const c=prompt('Para confirmar, digite EXCLUIR');
    if((c||'').trim().toUpperCase()!=='EXCLUIR'){toast('Exclusão cancelada');return}
    try{
      setSync('⏳ Excluindo…');
      const prov=(u.providerData[0]||{}).providerId;
      if(prov==='password'){
        const s=prompt('Por segurança, digite sua senha:');
        if(!s){setSync('☁️ Sincronizado');return}
        await A.reauthenticateWithCredential(u,A.EmailAuthProvider.credential(u.email,s));
      }else if(prov==='google.com'){
        await A.reauthenticateWithPopup(u,new A.GoogleAuthProvider());
      }
      if(unsub){unsub();unsub=null}
      clearTimeout(timer);
      await F.deleteDoc(F.doc(db,'usuarios',u.uid));
      ref=null;
      await A.deleteUser(u);
      window.usuario=null;
      D=novo();localStorage.setItem(CHAVE,JSON.stringify(D));localStorage.removeItem('semConta');localStorage.removeItem(PINK);
      aba='inicio';render();
      alert('Sua conta e todos os seus dados foram excluídos.');
    }catch(e){
      console.error(e);setSync('⚠️ Não foi possível excluir');
      alert('Não foi possível excluir: '+(MSG[e.code]||e.code||e.message));
    }
  };

  A.onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null}
    if(!u){ref=null;window.usuario=null;
      if(localStorage.getItem('semConta'))setSync('📱 Só neste aparelho');else{setSync('');mostrarLogin(true)}
      return}
    localStorage.removeItem('semConta');
    window.usuario=u.email||u.displayName||'conta';mostrarLogin(false);
    document.getElementById('erroLogin').textContent='';
    ref=F.doc(db,'usuarios',u.uid);setSync('⏳ Carregando…');
    let primeiro=true;
    unsub=F.onSnapshot(ref,snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(primeiro){primeiro=false;
        if(!snap.exists()){D.sincUid=u.uid;salva();if(aba==='mais')render();return}
        const r=snap.data(),remoto=JSON.parse(r.dados);
        if(D.sincUid===u.uid){if((D.atualizado||0)>(r.atualizado||0))nuvemSalvar();else aplicaRemoto(remoto,u.uid)}
        else if(tem(D)&&tem(remoto)){
          if(confirm('Encontrei dados neste aparelho E na sua conta.\n\nOK = usar os dados da CONTA (recomendado)\nCancelar = substituir a conta pelos dados DESTE APARELHO'))aplicaRemoto(remoto,u.uid);
          else{D.sincUid=u.uid;salva()}
        }else if(tem(D)){D.sincUid=u.uid;salva()}
        else aplicaRemoto(remoto,u.uid);
        setSync('☁️ Sincronizado');if(aba==='mais')render();return}
      const r=snap.data();if(!r)return;
      if((r.atualizado||0)>(D.atualizado||0))aplicaRemoto(JSON.parse(r.dados),u.uid,true);
      setSync('☁️ Sincronizado');
    },e=>{console.error(e);setSync(e.code==='permission-denied'?'⚠️ Sem permissão (regras do Firestore)':'⚠️ Erro ao sincronizar')});
  });
  }catch(e){console.error(e);setSync('📴 Sem conexão – usando dados do aparelho')}
}
</script>
</body>
</html>
